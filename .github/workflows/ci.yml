name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'src/__version__.py'
      - 'docs/**'
      - '*.md'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/ISSUE_TEMPLATE/**'

jobs:
  lint:
    uses: ./.github/workflows/common-lint.yml

  test-windows-312:
    needs: lint
    uses: ./.github/workflows/common-test.yml
    with:
      python-version: '3.12'
      os: windows-latest

  test-macos-312:
    needs: test-windows-312
    uses: ./.github/workflows/common-test.yml
    with:
      python-version: '3.12'
      os: macos-latest

  test-macos-313:
    needs: test-windows-312
    uses: ./.github/workflows/common-test.yml
    with:
      python-version: '3.13'
      os: macos-latest

  test-windows-313:
    needs: test-windows-312
    uses: ./.github/workflows/common-test.yml
    with:
      python-version: '3.13'
      os: windows-latest
